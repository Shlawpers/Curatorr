# Curatorr
# 1. Copy .env.example to .env and add your Plex details
# 2. Run: docker compose up -d
# 3. Open: http://localhost:3000

services:
  curatorr:
    # image: ghcr.io/shlawpers/curatorr:latest
    build: .
    container_name: curatorr
    ports:
      - "${PORT:-3000}:5100"
    environment:
      - PLEX_URL=${PLEX_URL:?Set PLEX_URL in .env}
      - PLEX_TOKEN=${PLEX_TOKEN:?Set PLEX_TOKEN in .env}
      - KOMETA_CONFIG_PATH=/kometa/config
      - APPLY_MODE=${APPLY_MODE:-dry-run}
      - TZ=${TZ:-UTC}
      # Optional authentication (uncomment to enable)
      - CURATORR_AUTH_ENABLED=${CURATORR_AUTH_ENABLED:-false}
      - CURATORR_AUTH_PASSWORD=${CURATORR_AUTH_PASSWORD:-}
      - CURATORR_SESSION_SECRET=${CURATORR_SESSION_SECRET:-}
    volumes:
      - curatorr-data:/app/data
      # Uncomment to enable Kometa conflict detection:
      # - /path/to/kometa/config:/kometa/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5100/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  curatorr-data:
